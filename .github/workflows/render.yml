name: Render MdMK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = টাইপ-চেক + স্টিল ছবি | preview = প্রথম ১৫ সেকেন্ড | final = পূর্ণ ভিডিও"
        required: true
        default: check
        type: choice
        options: [check, preview, final]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system libraries for Chrome
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev \
            libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 fonts-noto-core
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install npm packages
        run: npm install --no-audit --no-fund

      - name: Copy video to public/
        run: |
          test -f src/MdMK.mp4 || { echo "::error::src/MdMK.mp4 নেই"; exit 1; }
          mkdir -p public out
          cp src/MdMK.mp4 public/MdMK.mp4

      - name: Type check
        run: npm run typecheck

      - name: Download browser
        run: npx remotion browser ensure

      - name: "check — স্টিল ছবি (চেহারা-জোনসহ)"
        if: ${{ inputs.mode == 'check' }}
        run: |
          for f in 30 190 629 788 880 984 1118 1270 1369 1767 1899 2015; do
            npx remotion still src/index.ts MdMK out/still_$f.png --frame=$f --props='{"debug":true}'
          done

      - name: "preview — প্রথম ১৫ সেকেন্ড"
        if: ${{ inputs.mode == 'preview' }}
        run: npx remotion render src/index.ts MdMK out/preview.mp4 --frames=0-374 --concurrency=2

      - name: "final — পূর্ণ ভিডিও"
        if: ${{ inputs.mode == 'final' }}
        run: npx remotion render src/index.ts MdMK out/MdMK_final.mp4 --concurrency=2

      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ inputs.mode }}
          path: out/
