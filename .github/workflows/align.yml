name: Align MdMK timestamps

on:
  workflow_dispatch:

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install numpy requests "faster-whisper==1.0.3"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-medium-v1

      - name: Align
        run: python scripts/align.py src/MdMK.mp4 src/mdmk_timestamp.json aligned/mdmk_timestamp.aligned.json aligned

      - name: Show report in run summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat aligned/align_report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "--- Whisper যা শুনেছে ---" >> "$GITHUB_STEP_SUMMARY"
          cat aligned/whisper_transcript.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: aligned
          path: aligned/
